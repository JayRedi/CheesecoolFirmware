; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:cheesecool_bootloader]
platform = ch32v
board = ch32x035f8u6_evt_r0
framework = noneos-sdk
board_build.ldscript = bootloader/ld/boot.ld
board_build.startup = bootloader/startup_boot.S
build_src_filter = -<*>
extra_scripts =
    pre:scripts/bootloader_sources.py
    post:scripts/build_artifacts.py
build_flags =
    -Ibootloader
    -DDFU_BOOTLOADER_BUILD=1
upload_protocol = custom

[env:ch32x035f8u6_evt_r0]
platform = ch32v
board = ch32x035f8u6_evt_r0
framework = noneos-sdk
# Application binaries are linked at 0x2000 and must not be sent to wchisp
# as if they were bootloader-at-zero images. DFU upload requires an already
# enumerated Bootloader; the Application never requests DFU over HID.
upload_protocol = custom
upload_command = python3 $PROJECT_DIR/scripts/upload_dfu.py --application $BUILD_DIR/application.bin
build_flags =
    -DFEATURE_DEBUG_TEST=0
board_build.ldscript = ld/app.ld
board_build.startup = reference_min_app/startup_ch32x035.S
extra_scripts = post:scripts/build_artifacts.py

[env:SAFETY_DELAYED_ATTACH_4000MS]
extends = env:ch32x035f8u6_evt_r0
build_flags =
    -DFEATURE_DEBUG_TEST=0
    -DFEATURE_DFU_TEST=0
    -DFEATURE_USB_DELAYED_ATTACH_MS=4000UL

